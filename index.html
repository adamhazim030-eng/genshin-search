<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistem Carian Watak Genshin</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .login-box {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      width: 90%;
      max-width: 380px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      background: #6c63ff;
      color: white;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background: #5146ff;
    }

    .error {
      color: #ff5c5c;
      margin-top: 10px;
      display: none;
    }

    .footer {
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Login Sistem</h1>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="error" class="error">Username atau password salah</div>

    <div class="footer">
      Sistem Carian Watak Genshin Impact
    </div>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const error = document.getElementById("error");

      const USER = "admin";
      const PASS = "123";

      if (username === USER && password === PASS) {
        alert("Login berjaya!");
        window.location.href = "home.html"; 
      } else {
        error.style.display = "block";
      }
    }
  </script>

</body>
</html>
