<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maklumat Watak Genshin</title>

<link rel="stylesheet" href="style/detail.css">
<link rel="stylesheet" href="style/home.css">
</head>

<body>

<nav class="navbar">
  <div class="logo">✨ Genshin Finder</div>

  <div class="nav-links">
    <a href="index.html">Beranda</a>
    <a href="characters.html">Semua Watak</a>
    <a href="genshin.html">Cadangan Game</a>
  </div>

  <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
</nav>

<div class="main">

  <div class="char-top">
    <div class="image-panel">
      <img id="charImg" alt="Gambaran watak">
      <div class="img-glow"></div>
    </div>
    <div class="info">
      <h1 id="charName">Loading...</h1>
      <span id="charTitle" class="char-title-text"></span>
      <div id="tags" class="tag-row"></div>
      <div class="summary" id="charDescription">Loading character description...</div>
      <div class="stat-grid">
        <div class="stat-item"><span>Vision</span><strong id="vision">-</strong></div>
        <div class="stat-item"><span>Weapon</span><strong id="weaponType">-</strong></div>
        <div class="stat-item"><span>Nation</span><strong id="nation">-</strong></div>
        <div class="stat-item"><span>Affiliation</span><strong id="affiliation">-</strong></div>
        <div class="stat-item"><span>Rarity</span><strong id="rarity">-</strong></div>
        <div class="stat-item"><span>Constellation</span><strong id="constellationName">-</strong></div>
        <div class="stat-item"><span>Birthday</span><strong id="birthday">-</strong></div>
        <div class="stat-item"><span>Release</span><strong id="releaseDate">-</strong></div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Rekomendasi Build & Team</h2>
    <div id="recommendGrid" class="recommend-grid"></div>
  </div>

</div>

<script src="script/detail.js"></script>

<footer>© 2026 Genshin Search Team — Adam & Fikri</footer>

</body>
</html>
