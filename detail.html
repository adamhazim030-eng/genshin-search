<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maklumat Watak Genshin</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
    }

    .char-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .char-img {
      width: 200px;
      border-radius: 12px;
      border: 2px solid #6c63ff;
    }

    .info {
      max-width: 600px;
      background: rgba(0,0,0,0.45);
      padding: 15px;
      border-radius: 12px;
    }

    .info h2 {
      margin-top: 0;
    }

    .section {
      margin-top: 15px;
    }

    .section h3 {
      margin-bottom: 10px;
      border-bottom: 1px solid #6c63ff;
      padding-bottom: 5px;
    }

    .card-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-list img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      border: 1px solid #6c63ff;
    }

    .back {
      display: block;              /* make it take full width to allow auto margins */
      margin: 20px auto 0 auto;    /* vertical margin 20px, horizontal auto = centered */
      max-width: 200px;           /* optional cap so it doesn't stretch too wide */
      text-align: center;         /* center text inside */
      background: #6c63ff;
      padding: 10px 18px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
    }

    .back:hover {
      background: #5146ff;
    }
  </style>
</head>
<body>

  <h1 id="charName">Memuatkan...</h1>

  <div class="char-section">
    <!-- use the card endpoint for a richer image; fall back to icon if unavailable -->
    <img id="charImg" class="char-img" src="" alt="Watak">
    <div class="info" id="charInfo"></div>
  </div>

  <div class="section" id="weaponSection"></div>
  <div class="section" id="artifactSection"></div>
  <div class="section" id="materialSection"></div>
  <div class="section" id="talentSection"></div>
  <div class="section" id="constellationSection"></div>

  <a href="characters.html" class="back">⬅ Kembali ke Senarai Watak</a>

  <script>
    // utility to convert names into URL-friendly slugs
    function slugify(str) {
      return str
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");

    async function loadChar(name) {
      const charName = document.getElementById("charName");
      const charImg = document.getElementById("charImg");
      const charInfo = document.getElementById("charInfo");
      const weaponSection = document.getElementById("weaponSection");
      const artifactSection = document.getElementById("artifactSection");
      const materialSection = document.getElementById("materialSection");
      const talentSection = document.getElementById("talentSection");
      const constellationSection = document.getElementById("constellationSection");

      try {
        const res = await fetch(`https://genshin.jmp.blue/characters/${name}`);
        const data = await res.json();

        // Nama & gambar
        charName.textContent = data.name;
        // try card art first, then icon-big as fallback
        charImg.alt = data.name;
        charImg.src = `https://genshin.jmp.blue/characters/${name}/card`;
        // if card fails (404), swap to icon-big; if that fails hide image
        charImg.onerror = () => {
          if (charImg.src.endsWith('/card')) {
            charImg.src = `https://genshin.jmp.blue/characters/${name}/icon-big`;
          } else {
            charImg.style.display = 'none';
          }
        };

        // Info asas
        // build HTML piecewise so we don't accidentally render undefined
        let basicHtml = '<h2>Maklumat Asas</h2>';
        if (data.nation) basicHtml += `<p><strong>Nation / Region:</strong> ${data.nation}</p>`;
        const elementVal = data.vision || data.element;
        if (elementVal) basicHtml += `<p><strong>Element:</strong> ${elementVal}</p>`;
        if (data.rarity !== undefined) basicHtml += `<p><strong>Rarity:</strong> ${data.rarity}⭐</p>`;
        charInfo.innerHTML = basicHtml;


      } catch (err) {
        charName.textContent = "Watak tidak dijumpai";
        charImg.style.display = "none";
        charInfo.innerHTML = "<p>Sila pastikan URL betul atau cuba watak lain.</p>";
      }
    }

    if (name) loadChar(name);
  </script>

</body>
</html>
