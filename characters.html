<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Genshin Character Archive</title>

<style>
*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

:root {
  --bg: linear-gradient(-45deg,#0f0f1c,#1b1b38,#2b2b52,#0f0f1c);
  --text: white;
  --card-bg: rgba(255,255,255,.08);
  --btn-bg: #6c63ff;
  --btn-hover: rgba(108,99,255,.7);
  --h1-gradient: linear-gradient(135deg,#6c63ff,#00c6ff);
  --text-fill: transparent;
  --subtitle-color: rgba(255,255,255,0.8);
  --topbar-bg: rgba(0,0,0,.4);
  --grid-bg: rgba(255,255,255,.08);
  --small-color: rgba(255,255,255,0.7);
  --back-bg: #6c63ff;
  --back-hover: rgba(108,99,255,.7);
  --rec-btn-bg: #6c63ff;
  --rec-btn-hover: rgba(108,99,255,.8);
  --filter-bg: #1d1e3a;
}

body.light {
  --bg: linear-gradient(-45deg,#f5f5f5,#ffffff,#e8e8e8,#f5f5f5);
  --text: #333;
  --card-bg: rgba(0,0,0,.05);
  --btn-bg: #6c63ff;
  --btn-hover: rgba(108,99,255,.7);
  --h1-gradient: linear-gradient(135deg,#333,#6c63ff);
  --text-fill: transparent;
  --subtitle-color: rgba(0,0,0,0.7);
  --topbar-bg: rgba(255,255,255,.8);
  --grid-bg: rgba(0,0,0,.05);
  --small-color: rgba(0,0,0,0.7);
  --back-bg: #6c63ff;
  --back-hover: rgba(108,99,255,.7);
  --rec-btn-bg: #6c63ff;
  --rec-btn-hover: rgba(108,99,255,.8);
  --filter-bg: #e0e0e0;
}

body.light {
  --bg: linear-gradient(-45deg,#f5f5f5,#ffffff,#e8e8e8,#f5f5f5);
  --text: #333;
  --card-bg: rgba(0,0,0,.05);
  --btn-bg: #6c63ff;
  --btn-hover: rgba(108,99,255,.7);
  --h1-gradient: linear-gradient(135deg,#333,#6c63ff);
  --text-fill: transparent;
  --subtitle-color: rgba(0,0,0,0.7);
  --topbar-bg: rgba(255,255,255,.8);
  --grid-bg: rgba(0,0,0,.05);
  --small-color: rgba(0,0,0,0.7);
  --back-bg: #6c63ff;
  --back-hover: rgba(108,99,255,.7);
  --rec-btn-bg: #6c63ff;
  --rec-btn-hover: rgba(108,99,255,.8);
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  background-size:400% 400%;
  animation:bgmove 18s ease infinite;
  color:var(--text);
  padding:15px;
}

@keyframes bgmove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

header{
  text-align:center;
  margin-bottom:15px;
}

header h1{
  margin:0;
  font-size:28px;
  background:var(--h1-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:var(--text-fill);
}

.subtitle{
  opacity:.8;
  font-size:14px;
  color:var(--subtitle-color);
}

.filters{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
  margin:15px 0;
}

.filters button{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  min-height:100px;
  overflow:hidden;
  border-radius:18px;
  border:none;
  padding:0;
  background:var(--filter-bg);
  color:white;
  cursor:pointer;
  box-shadow:0 16px 35px rgba(0,0,0,.2);
  transition:.35s;
}

.filters button::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.75));
}

.filters button img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.7) saturate(1.2);
}

.filters button span{
  position:relative;
  z-index:1;
  padding:14px 12px;
  width:100%;
  text-align:center;
  font-weight:700;
  letter-spacing:.4px;
}

.filters button:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 40px rgba(108,99,255,.45);
}

.filters button.active{
  box-shadow:0 0 0 2px rgba(108,99,255,.9),0 18px 35px rgba(108,99,255,.25);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:15px;
}

.card{
  background:var(--card-bg);
  border-radius:15px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:.35s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.15),transparent);
  transform:translateX(-100%);
  transition:.5s;
}

.card:hover::before{
  transform:translateX(100%);
}

.card:hover{
  transform:translateY(-8px) scale(1.05);
  box-shadow:0 0 20px rgba(108,99,255,.7);
}

.card img{
  width:100%;
  max-width:110px;
  margin-bottom:5px;
  filter:drop-shadow(0 0 10px rgba(0,0,0,.7));
}

.card p{
  margin:3px 0;
  font-weight:600;
}

.card small{
  opacity:.7;
  color:var(--small-color);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  background:var(--topbar-bg);
  padding:10px;
  border-radius:10px;
}

.back{
  text-decoration:none;
  padding:8px 16px;
  border-radius:20px;
  background:var(--back-bg);
  color:white;
  transition:.3s;
}

.back:hover{
  transform:scale(1.05);
  box-shadow:0 0 12px var(--back-hover);
}

.btn{
  display:block;
  text-align:center;
  margin:15px auto;
  width:fit-content;
  padding:12px 26px;
  border-radius:30px;
  background:var(--rec-btn-bg);
  color:white;
  text-decoration:none;
  font-size:18px;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px var(--rec-btn-hover);
}

/* Dark/Light Mode Toggle */
.theme-toggle {
  background: var(--btn-bg);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: .3s;
}

.theme-toggle:hover {
  transform: scale(1.05);
  box-shadow: 0 0 12px var(--btn-hover);
}
@keyframes pulse{
  0%{opacity:.4}
  50%{opacity:1}
  100%{opacity:.4}
}
</style>
</head>

<body>

<div class="topbar">
  <a href="home.html" class="back">⬅ Home</a>
  <span class="subtitle">Live API Data</span>
  <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
</div>
<!-- recommendation button -->
<a href="genshin.html" class="btn">🎮 Cadangan Game Genshin Impact</a>

<header>
  <h1>Genshin Character Archive</h1>
  <p class="subtitle">Semua watak rasmi Genshin Impact</p>
</header>

<div class="search-container" style="text-align:center;margin-bottom:12px;">
  <input id="charSearch" type="text" placeholder="Cari watak... (contoh: amber)" style="padding:8px 12px;border-radius:8px;border:none;width:60%;max-width:320px;">
  <button id="searchBtn" style="padding:8px 12px;border-radius:8px;border:none;background:#6c63ff;color:white;cursor:pointer;margin-left:6px;">Cari</button>
</div>

<div class="filters" id="regionButtons"></div>

<div id="grid" class="grid"></div>

<script>
const grid = document.getElementById("grid");
const charSearch = document.getElementById("charSearch");
const searchBtn = document.getElementById("searchBtn");

let allCharsData = []; // cached character detail objects { nameKey, data }
let currentRegion = 'all';

const regions = [
  { key: 'all', label: 'Semua', image: 'images/regions/all.jpg' },
  { key: 'mondstadt', label: 'Mondstadt', image: 'images/regions/monstand.jpg' },
  { key: 'liyue', label: 'Liyue', image: 'images/regions/liyue.jpg' },
  { key: 'inazuma', label: 'Inazuma', image: 'images/regions/inazuma.jpg' },
  { key: 'sumeru', label: 'Sumeru', image: 'images/regions/sumeru.jpg' },
  { key: 'fontaine', label: 'Fontaine', image: 'images/regions/fontaine.jpg' },
  { key: 'natlan', label: 'Natlan', image: 'images/regions/natlan.jpg' },
  { key: 'snezhnaya', label: 'Snezhnaya', image: 'images/regions/all.jpg' } // placeholder since no image
];

function renderRegionButtons(){
  const container = document.getElementById('regionButtons');
  container.innerHTML = '';
  regions.forEach(region => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = region.key === currentRegion ? 'active' : '';
    button.dataset.region = region.key;
    button.innerHTML = `
      <img src="${region.image}" alt="${region.label}">
      <span>${region.label}</span>
    `;
    button.addEventListener('click', () => {
      loadChars(region.key);
      document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    });
    container.appendChild(button);
  });
}

// API endpoints to try (in order of preference)
const apiEndpoints = [
  {
    name: 'genshin.jmp.blue',
    listUrl: 'https://genshin.jmp.blue/characters',
    detailUrl: (name) => `https://genshin.jmp.blue/characters/${name}`
  },
  {
    name: 'api.genshin.dev',
    listUrl: 'https://api.genshin.dev/characters',
    detailUrl: (name) => `https://api.genshin.dev/characters/${name.replace(/-/g, '_').toUpperCase()}`
  },
  {
    name: 'genshin-db-api',
    listUrl: 'https://genshin-db-api.vercel.app/api/characters',
    detailUrl: (name) => `https://genshin-db-api.vercel.app/api/characters/${name}`
  }
];

async function tryFetchCharList(){
  for(const api of apiEndpoints){
    try{
      console.log(`Trying ${api.name}...`);
      const res = await fetch(api.listUrl, {timeout: 5000});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      
      if(Array.isArray(data) && data.length > 0){
        console.log(`✅ Successfully fetched from ${api.name}`);
        return {api, list: data};
      }
    }catch(e){
      console.log(`❌ ${api.name} failed: ${e.message}`);
    }
  }
  throw new Error('All APIs failed');
}

async function fetchCharDetail(name, api){
  try{
    const url = api.detailUrl(name);
    const res = await fetch(url, {timeout: 5000});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }catch(e){
    console.log(`Failed to fetch ${name} from ${api.name}: ${e.message}`);
    return null;
  }
}

async function loadChars(region){
  currentRegion = region;
  grid.innerHTML = '<div class="loader">🔄 Memuatkan data watak...</div>';

  try{
    // Try to fetch character list from available APIs
    const {api, list} = await tryFetchCharList();
    
    console.log(`Fetching details for ${list.length} characters...`);
    
    // fetch details concurrently but tolerate failures
    const detailPromises = list.map(name =>
      fetchCharDetail(name, api).then(d => d ? {nameKey:name, data:d} : null).catch(() => null)
    );

    const settled = await Promise.allSettled(detailPromises);
    allCharsData = settled.map(s => (s.status==='fulfilled' ? s.value : null)).filter(Boolean);

    if(allCharsData.length === 0){
      throw new Error('No character data retrieved');
    }

    console.log(`✅ Loaded ${allCharsData.length} characters`);
    renderList();
  }catch(e){
    console.error('Error loading characters:', e);
    grid.innerHTML = '<div class="loader">❌ Gagal memuat data. Sila cuba lagi.</div>';
  }
}

function renderList(){
  grid.innerHTML = '';
  const q = (charSearch.value || '').trim().toLowerCase();

  for(const item of allCharsData){
    const data = item.data;
    const nameKey = item.nameKey;
    if(!data) continue;
    if(currentRegion !== 'all' && data.nation && data.nation.toLowerCase() !== currentRegion) continue;
    if(q && (!data.name || !data.name.toLowerCase().includes(q))) continue;

    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <img src="https://genshin.jmp.blue/characters/${nameKey}/icon-big">
      <p>${data.name}</p>
      <small>${data.nation || ''}</small>
    `;
    div.onclick = ()=>openDetail(nameKey);
    grid.appendChild(div);
  }

  if(grid.children.length===0){
    grid.innerHTML = '<div class="loader">Tiada watak ditemui.</div>';
  }
}

function openDetail(name){
  window.location.href = `detail.html?name=${name}`;
}

searchBtn.addEventListener('click', ()=>renderList());
charSearch.addEventListener('keyup', (e)=>{ if(e.key==='Enter') renderList(); });

renderRegionButtons();
loadChars('all');
</script>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const body = document.body;

  // Load saved theme
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    body.classList.add('light');
    themeToggle.textContent = '☀️ Light';
  } else {
    themeToggle.textContent = '🌙 Dark';
  }

  themeToggle.addEventListener('click', () => {
    body.classList.toggle('light');
    const isLight = body.classList.contains('light');
    themeToggle.textContent = isLight ? '☀️ Light' : '🌙 Dark';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  });
</script>

  <footer>© 2026 Genshin Search Team — Adam & Fikri</footer>

</body>
</html>
