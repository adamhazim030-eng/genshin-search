<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadangan Game - Genshin Impact</title>

  <style>
  *{box-sizing:border-box;font-family:'Segoe UI',sans-serif}

  :root {
    --bg: linear-gradient(-45deg,#0f0f1c,#1b1b38,#2b2b52,#0f0f1c);
    --text: white;
    --container-bg: rgba(255,255,255,.08);
    --btn-bg: #6c63ff;
    --btn-hover: rgba(108,99,255,.8);
    --video-card-bg: rgba(255,255,255,0.04);
  }

  body.light {
    --bg: linear-gradient(-45deg,#f5f5f5,#ffffff,#e8e8e8,#f5f5f5);
    --text: #333;
    --container-bg: rgba(0,0,0,.05);
    --btn-bg: #6c63ff;
    --btn-hover: rgba(108,99,255,.8);
    --video-card-bg: rgba(0,0,0,0.04);
  }

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    background-size:400% 400%;
    animation:bg 18s ease infinite;
    color:var(--text);
    padding:20px;
  }

  @keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .container{
    max-width:900px;
    margin:auto;
    background:var(--container-bg);
    border-radius:18px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
  }

  h1{text-align:center}

  .images{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:15px -25px;
    width:calc(100% + 50px);
    position:relative;
    overflow:hidden;
    background:rgba(0,0,0,.3);
  }

  .images img{
    width:100%;
    height:auto;
    max-height:400px;
    object-fit:contain;
    border-radius:0;
    transition:.3s;
    animation: slideIn .5s ease-in-out;
  }

  @keyframes slideIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .images img:hover{
    transform:scale(1.02);
    box-shadow:0 0 15px rgba(108,99,255,.8);
  }

  .carousel-nav{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:10;
  }

  .carousel-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
    cursor:pointer;
    transition:.3s;
    border:none;
  }

  .carousel-dot.active{
    background:#6c63ff;
    transform:scale(1.3);
  }

  .carousel-dot:hover{
    background:rgba(255,255,255,.8);
  }

  @media(max-width:768px){
    .images{
      margin:15px -20px;
      width:calc(100% + 40px);
    }

    .images img{
      max-height:250px;
    }
  }

  @media(max-width:480px){
    .images{
      margin:15px -15px;
      width:calc(100% + 30px);
    }

    .images img{
      max-height:180px;
    }
  }

  .rating{
    text-align:center;
    font-size:26px;
    margin:10px 0;
  }

  .btn{
    display:block;
    text-align:center;
    margin:15px auto;
    width:fit-content;
    padding:12px 26px;
    border-radius:30px;
    background:var(--btn-bg);
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
  }

  .btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px var(--btn-hover);
  }

  iframe{
    width:100%;
    height:350px;
    border-radius:15px;
    border:none;
  }

  /* video cards */
  .video-section{display:flex;flex-direction:column;gap:20px;margin-top:20px}
  .video-card{background:var(--video-card-bg);padding:12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,0.4)}
  .video-card h3{margin:0 0 10px 0}
  .video-wrapper{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px}
  .video-wrapper iframe{position:absolute;width:100%;height:100%;left:0;top:0;border:0}

  /* Dark/Light Mode Toggle */
  .theme-toggle {
    background: var(--btn-bg);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: .3s;
  }

  .theme-toggle:hover {
    transform: scale(1.05);
    box-shadow: 0 0 12px var(--btn-hover);
  }
  </style>
</head>

<body>

  <div style="text-align: center; margin-bottom: 20px;">
    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
  </div>

  <div class="container">

    <h1>🎮 Cadangan Game: Genshin Impact</h1>

    <!-- Full width horizontal banner carousel -->
    <div class="images" id="promotionCarousel">
      <img id="carouselImg" src="images/promotion-genshin-impact/1.webp" alt="Genshin Impact Promotion Banner">
      <div class="carousel-nav" id="carouselNav"></div>
    </div>

    <p>
      Genshin Impact ialah game open-world RPG dengan grafik anime,
      jalan cerita menarik, sistem combat element, dan karakter unik.
      <section class="video-section">
        <div class="video-card">
          <h3>⚔️ Epic Boss Battle</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/lpv1ungKNc0?si=pcG6rCP3SdPZyKb4" allowfullscreen></iframe>
          </div>
        </div>

        <div class="video-card">
          <h3>⚡ Dragonspine Battle</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/JPnsUuKMiaU?si=VThCc7pCx3HqupwV" allowfullscreen></iframe>
          </div>
        </div>

        <div class="video-card">
          <h3>💥 Natlan Combat Action</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/MpYueGE6FQ8?rel=0" allowfullscreen></iframe>
          </div>
        </div>

        <div class="video-card">
          <h3>🎥 Extra Trailer</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/q5WeTMUTiak?si=nfubFFh48MawV9OB" allowfullscreen></iframe>
          </div>
        </div>
      </section>
    </div>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.miHoYo.GenshinImpact" target="_blank">
      📥 Download di Play Store
    </a>

    <a class="btn" href="home.html">
      ⬅ Kembali ke Home
    </a>

  </div>

  <script>
    // Carousel functionality
    const images = ['images/promotion-genshin-impact/1.webp', 'images/promotion-genshin-impact/2.jpg', 'images/promotion-genshin-impact/3.jpg'];
    let currentImageIndex = 0;
    const carouselImg = document.getElementById('carouselImg');
    const carouselNav = document.getElementById('carouselNav');

    // Create dots
    images.forEach((_, index) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
      dot.addEventListener('click', () => showImage(index));
      carouselNav.appendChild(dot);
    });

    function showImage(index) {
      currentImageIndex = index;
      carouselImg.src = images[currentImageIndex];
      document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentImageIndex);
      });
    }

    // Auto-rotate every 5 seconds
    setInterval(() => {
      currentImageIndex = (currentImageIndex + 1) % images.length;
      showImage(currentImageIndex);
    }, 5000);
  </script>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      body.classList.add('light');
      themeToggle.textContent = '☀️ Light';
    } else {
      themeToggle.textContent = '🌙 Dark';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('light');
      const isLight = body.classList.contains('light');
      themeToggle.textContent = isLight ? '☀️ Light' : '🌙 Dark';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  </script>

</body>
</html>
