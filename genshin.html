<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadangan Game - Genshin Impact</title>

  <style>
  *{box-sizing:border-box;font-family:'Segoe UI',sans-serif}

  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(-45deg,#0f0f1c,#1b1b38,#2b2b52,#0f0f1c);
    background-size:400% 400%;
    animation:bg 18s ease infinite;
    color:white;
    padding:20px;
  }

  @keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .container{
    max-width:900px;
    margin:auto;
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
  }

  h1{text-align:center}

  .images{
    display:flex;
    justify-content:center;
    margin:15px 0;
  }

  .images img{
    width:100%;
    max-width:600px;
    border-radius:15px;
    transition:.3s;
  }

  .images img:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(108,99,255,.8);
  }

  .rating{
    text-align:center;
    font-size:26px;
    margin:10px 0;
  }

  .btn{
    display:block;
    text-align:center;
    margin:15px auto;
    width:fit-content;
    padding:12px 26px;
    border-radius:30px;
    background:#6c63ff;
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
  }

  .btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(108,99,255,.8);
  }

  iframe{
    width:100%;
    height:350px;
    border-radius:15px;
    border:none;
  }

  /* video cards */
  .video-section{display:flex;flex-direction:column;gap:20px;margin-top:20px}
  .video-card{background:rgba(255,255,255,0.04);padding:12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,0.4)}
  .video-card h3{margin:0 0 10px 0}
  .video-wrapper{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px}
  .video-wrapper iframe{position:absolute;width:100%;height:100%;left:0;top:0;border:0}
  </style>
</head>

<body>

  <div class="container">

    <h1>🎮 Cadangan Game: Genshin Impact</h1>

    <!-- show trailer thumbnail instead of static wallpapers -->
    <div class="images">
      <a href="https://www.youtube.com/watch?v=TAlKhARUcoY" target="_blank">
        <img src="https://img.youtube.com/vi/TAlKhARUcoY/maxresdefault.jpg" alt="Genshin Impact Trailer">
      </a>
    </div>

    <p>
      Genshin Impact ialah game open-world RPG dengan grafik anime,
      jalan cerita menarik, sistem combat element, dan karakter unik.
      <section class="video-section">
        <div class="video-card">
          <h3>⚔️ Epic Boss Battle</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/lpv1ungKNc0?si=pcG6rCP3SdPZyKb4" allowfullscreen></iframe>
          </div>
        </div>

        <div class="video-card">
          <h3>⚡ Dragonspine Battle</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/JPnsUuKMiaU?si=VThCc7pCx3HqupwV" allowfullscreen></iframe>
          </div>
        </div>

        <div class="video-card">
          <h3>💥 Natlan Combat Action</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/MpYueGE6FQ8?rel=0" allowfullscreen></iframe>
          </div>
        </div>

        <div class="video-card">
          <h3>🎥 Extra Trailer</h3>
          <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/q5WeTMUTiak?si=nfubFFh48MawV9OB" allowfullscreen></iframe>
          </div>
        </div>
      </section>
    </div>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.miHoYo.GenshinImpact" target="_blank">
      📥 Download di Play Store
    </a>

    <a class="btn" href="home.html">
      ⬅ Kembali ke Home
    </a>

  </div>

</body>
</html>
